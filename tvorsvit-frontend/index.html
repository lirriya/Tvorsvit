<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tvorsvit</title>
    <script>
      (function () {
        var theme = 'light';
        var scale = 'md';
        try {
          var storedTheme = window.localStorage.getItem('tvorsvit-theme');
          if (storedTheme === 'dark' || storedTheme === 'light') theme = storedTheme;
          var storedScale = window.localStorage.getItem('tvorsvit-scale');
          if (storedScale === 'lg' || storedScale === 'xl' || storedScale === 'md') scale = storedScale;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.scale = scale;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
